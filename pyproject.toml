[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swatten-modbus"
version = "0.1.0"
description = "Read a Swatten (Sieyuan Watten) SiH-series hybrid solar inverter over Modbus."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "swatten-modbus contributors" }]
keywords = ["modbus", "swatten", "sieyuan", "watten", "inverter", "solar", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
# Protocol + the device-modelling framework (modbus_connection.model). The caller
# injects a ModbusUnit built from whichever backend they choose; tmodbus is the
# backend modbus-connection's own suite runs against.
dependencies = ["modbus-connection[tmodbus]>=4.7.0"]

[project.urls]
Homepage = "https://github.com/balloobbot/swatten-modbus"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swatten_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
